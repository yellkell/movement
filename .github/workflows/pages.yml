name: Deploy STEPWELL + VOIDSTEP to Pages

on:
  push:
    branches:
      - main
      - claude/iwsdk-research-experience-elinqr
    paths:
      - 'stepwell/**'
      - 'voidstep/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Pages needs id-token to publish; contents:read is all the build wants.
permissions:
  contents: read
  pages: write
  id-token: write

# Per-ref groups: a branch build can never cancel a main deploy; a newer
# push to the same ref supersedes an in-flight one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
          cache-dependency-path: |
            stepwell/package-lock.json
            voidstep/package-lock.json

      # Cheap gate: a build that typechecks is a build worth publishing.
      - run: npm ci
        working-directory: stepwell
      - run: npm run typecheck
        working-directory: stepwell
      - run: npm run build
        working-directory: stepwell

      - run: npm ci
        working-directory: voidstep
      - run: npm run typecheck
        working-directory: voidstep
      - run: npm run build
        working-directory: voidstep

      # One site: the well at the root (its historical home), the circuit
      # under /voidstep/. Vite emits ./assets/... relative URLs, so both
      # apps run from their subpaths unchanged. .nojekyll keeps Pages from
      # touching the output.
      - run: |
          mkdir -p site
          cp -r stepwell/dist/. site/
          mkdir -p site/voidstep
          cp -r voidstep/dist/. site/voidstep/
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # The github-pages environment only accepts the default branch; branch
    # pushes still run the build as CI, but skip the deploy cleanly.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
